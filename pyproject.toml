[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crashproof-lab"
version = "1.0.0"
description = "A Temporal-backed order workflow laboratory for failure recovery and idempotent side effects"
requires-python = ">=3.11"
dependencies = ["temporalio==1.36.1", "fastapi==0.165.0", "uvicorn==0.54.0", "httpx==0.28.1", "opentelemetry-sdk==1.45.2"]

[tool.setuptools.packages.find]
include = ["crashproof*"]

[tool.setuptools.package-data]
crashproof = ["static/*"]
